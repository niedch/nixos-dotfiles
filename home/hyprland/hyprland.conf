# Monitor configuration (host-specific, generated by Home Manager)
source = ~/.config/hypr/monitors.conf

# Autostart Noctalia
exec-once = noctalia

# Environment variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0,0.35,1
    bezier = linear,0,0,1,1
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, easeOutQuint
    animation = fadeOut, 1, 1.46, easeOutQuint
    animation = fade, 1, 3.03, easeOutQuint
    animation = border, 1, 6, easeOutQuint
    animation = workspaces, 1, 4, easeOutQuint
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

cursor {
    no_hardware_cursors = true
}

render {
    direct_scanout = 0
}

input {
    kb_layout = us
    kb_options = compose:caps,shift:both_capslock_cancel
    repeat_rate = 40
    repeat_delay = 250
    numlock_by_default = true
    sensitivity = 0.35
    accel_profile = flat

    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
        scroll_factor = 0.4
        disable_while_typing = false
        drag_3fg = 1
    }
}

device {
    name = at-translated-set-2-keyboard
    kb_layout = at
}

device {
    name = corne-choc-pro-keyboard
    kb_layout = us
}

device {
    name = roccat-roccat-vulcan-aimo
    kb_layout = at
}

# Layer rules for Noctalia
layerrule = noanim, ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
layerrule = blur, ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
layerrule = ignorealpha 0.2, ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$

# Noctalia settings window rule
windowrulev2 = float, class:^(dev.noctalia.Noctalia)$
windowrulev2 = size 1080 920, class:^(dev.noctalia.Noctalia)$

# Full opacity for video streaming and special workspace windows
windowrulev2 = opacity 1.0 1.0, class:^(chrome-.*amazon.*|chrome-.*twitch.*)$
windowrulev2 = opacity 1.0 1.0, onworkspace:s[true]

# Smart gaps: remove gaps, borders, and rounding when alone on workspace
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

$mainMod = SUPER
$terminal = ghostty
$fileManager = nautilus
$ipc = noctalia msg

# Terminal and app control
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, W, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, L, togglefloating,
bind = $mainMod SHIFT, V, togglefloating,
bind = $mainMod, C, sendshortcut, CTRL, c, activewindow
bind = $mainMod, V, sendshortcut, CTRL, v, activewindow
bind = $mainMod, F, fullscreen, 0

# Noctalia controls
bind = $mainMod, SPACE, exec, $ipc panel-toggle launcher
bind = $mainMod, S, exec, $ipc panel-toggle control-center
bind = $mainMod, comma, exec, $ipc settings-toggle
bind = ALT, TAB, exec, $ipc window-switcher hold
bind = ALT SHIFT, TAB, exec, $ipc window-switcher hold reverse

# Screenshots (Noctalia built-in)
bind = , Print, exec, $ipc screenshot-fullscreen
bind = $mainMod SHIFT, S, exec, $ipc panel-toggle screenshot

# Lock screen & Session power menu
bind = $mainMod, escape, exec, $ipc session lock
bind = $mainMod SHIFT, L, exec, $ipc session lock
bind = $mainMod SHIFT, Q, exec, $ipc panel-toggle session

# AI Mirror kill switch
bind = $mainMod SHIFT, escape, exec, ai-mirror control off

# Media keys
bindel = , XF86AudioRaiseVolume, exec, $ipc volume-up
bindel = , XF86AudioLowerVolume, exec, $ipc volume-down
bindl = , XF86AudioMute, exec, $ipc volume-mute
bindel = , XF86MonBrightnessUp, exec, $ipc brightness-up
bindel = , XF86MonBrightnessDown, exec, $ipc brightness-down

# Focus movement (arrows and hjkl)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Window movement
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Numeric Silent Moves (Super + Shift + Alt + 1..0)
bind = $mainMod SHIFT ALT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT ALT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT ALT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT ALT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT ALT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT ALT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT ALT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT ALT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT ALT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT ALT, 0, movetoworkspacesilent, 10

# Corne-keyboard workspace bindings (CTRL + ALT + Q/W/E/R/T/Y/U/I/O/P)
bind = CTRL ALT, Q, workspace, 1
bind = CTRL ALT, W, workspace, 2
bind = CTRL ALT, E, workspace, 3
bind = CTRL ALT, R, workspace, 4
bind = CTRL ALT, T, workspace, 5
bind = CTRL ALT, Y, workspace, 6
bind = CTRL ALT, U, workspace, 7
bind = CTRL ALT, I, workspace, 8
bind = CTRL ALT, O, workspace, 9
bind = CTRL ALT, P, workspace, 10

bind = CTRL ALT SHIFT, Q, movetoworkspace, 1
bind = CTRL ALT SHIFT, W, movetoworkspace, 2
bind = CTRL ALT SHIFT, E, movetoworkspace, 3
bind = CTRL ALT SHIFT, R, movetoworkspace, 4
bind = CTRL ALT SHIFT, T, movetoworkspace, 5
bind = CTRL ALT SHIFT, Y, movetoworkspace, 6
bind = CTRL ALT SHIFT, U, movetoworkspace, 7
bind = CTRL ALT SHIFT, I, movetoworkspace, 8
bind = CTRL ALT SHIFT, O, movetoworkspace, 9
bind = CTRL ALT SHIFT, P, movetoworkspace, 10

# Corne Silent Moves (Ctrl + Alt + Shift + Super + Q..P)
bind = CTRL ALT SHIFT $mainMod, Q, movetoworkspacesilent, 1
bind = CTRL ALT SHIFT $mainMod, W, movetoworkspacesilent, 2
bind = CTRL ALT SHIFT $mainMod, E, movetoworkspacesilent, 3
bind = CTRL ALT SHIFT $mainMod, R, movetoworkspacesilent, 4
bind = CTRL ALT SHIFT $mainMod, T, movetoworkspacesilent, 5
bind = CTRL ALT SHIFT $mainMod, Y, movetoworkspacesilent, 6
bind = CTRL ALT SHIFT $mainMod, U, movetoworkspacesilent, 7
bind = CTRL ALT SHIFT $mainMod, I, movetoworkspacesilent, 8
bind = CTRL ALT SHIFT $mainMod, O, movetoworkspacesilent, 9
bind = CTRL ALT SHIFT $mainMod, P, movetoworkspacesilent, 10

# Workspace-to-monitor moves
bind = $mainMod, TAB, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT, TAB, movecurrentworkspacetomonitor, -1
bind = CTRL ALT, TAB, movecurrentworkspacetomonitor, +1
bind = CTRL ALT SHIFT, TAB, movecurrentworkspacetomonitor, -1

# Workspace history and mouse wheel cycling
bind = $mainMod CTRL, TAB, workspace, previous
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Special Workspaces (H & G)
bind = CTRL ALT, H, togglespecialworkspace, h-workspace
bind = CTRL ALT, G, togglespecialworkspace, g-workspace
bind = $mainMod, G, togglespecialworkspace, g-workspace
bind = CTRL ALT SHIFT, H, movetoworkspacesilent, special:h-workspace
bind = CTRL ALT SHIFT, G, movetoworkspacesilent, special:g-workspace

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
