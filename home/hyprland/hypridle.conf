general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ monitors = "all", on = true })'
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = hyprlock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ monitors = "all", on = false })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ monitors = "all", on = true })'
}
