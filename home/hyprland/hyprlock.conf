source = ~/.config/hypr/hyprlock-theme.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = overshoot, 0.05, 0.9, 0.1, 1.05
    animation = fadeIn, 1, 4, overshoot
    animation = fadeOut, 1, 4, overshoot
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 3

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = $font_color
    position = 0, -180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date "+%A, %d %B %Y"
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    color = $font_color
    position = 0, -110
    halign = center
    valign = center
}
