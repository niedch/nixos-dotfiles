source = ~/.config/hypr/hyprlock-theme.conf

general {
    hide_cursor = true
    disable_loading_bar = false
    grace = 1
}

animations {
    enabled = true
    bezier = overshoot, 0.05, 0.9, 0.1, 1.05
    animation = fadeIn, 1, 4, overshoot
    animation = fadeOut, 1, 4, overshoot
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# LEFT COLUMN
shape {
    monitor =
    size = 360, 380
    color = rgba(0,0,0,0.3)
    rounding = 25
    border_size = 0
    position = -200, 160
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] echo $HOSTNAME
    font_family = JetBrainsMono Nerd Font
    font_size = 14
    color = $outer_color
    position = -200, 300
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = Log in
    font_family = JetBrainsMono Nerd Font
    font_size = 42
    color = $font_color
    position = -200, 240
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 320, 70
    color = $outer_color
    rounding = 20
    position = -200, 130
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = username
    font_family = JetBrainsMono Nerd Font
    font_size = 10
    color = $color
    position = -200, 150
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = <b>$USER</b>
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    color = $color
    position = -200, 115
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = password
    font_family = JetBrainsMono Nerd Font
    font_size = 10
    color = $color
    position = -200, 60
    halign = center
    valign = center
    zindex = 3
}

input-field {
    monitor =
    size = 320, 70
    outline_thickness = 0
    outer_color = rgba(0,0,0,0)
    inner_color = $outer_color
    font_family = JetBrainsMono Nerd Font
    font_color = $color
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 20
    position = -200, 40
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 360, 160
    color = rgba(0,0,0,0.3)
    rounding = 25
    position = -200, -140
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = JetBrainsMono Nerd Font
    font_size = 72
    color = $font_color
    position = -200, -125
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] echo " UPTIME $(uptime -p | sed 's/up //; s/ hours\?/H/g; s/ minutes\?/M/g; s/,//g')"
    font_family = JetBrainsMono Nerd Font
    font_size = 14
    color = $outer_color
    position = -260, -195
    halign = center
    valign = center
    zindex = 2
}

# RIGHT COLUMN
shape {
    monitor =
    size = 360, 380
    color = rgba(0,0,0,0.3)
    rounding = 25
    position = 200, 160
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date "+%A" | tr '[:lower:]' '[:upper:]'
    font_family = JetBrainsMono Nerd Font
    font_size = 38
    color = $font_color
    position = 200, 150
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date "+%d %B, %Y"
    font_family = JetBrainsMono Nerd Font
    font_size = 14
    color = $outer_color
    position = 200, 100
    halign = center
    valign = center
    zindex = 11
}

shape {
    monitor =
    size = 360, 320
    color = $inner_color
    rounding = 25
    position = 200, -140
    halign = center
    valign = center
    zindex = 10
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0,0,0,0.5)
}

label {
    monitor =
    text = cmd[update:5000] if playerctl status 2>/dev/null | grep -q Playing; then playerctl metadata --format '{{ uc(playerName) }}' 2>/dev/null | grep -qi spotify && echo "" || echo ""; else echo "󰎆"; fi
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    color = $font_color
    position = 200, -10
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:5000] title=$(playerctl metadata xesam:title 2>/dev/null); if [ -n "$title" ]; then echo "$title" | cut -c1-24; else echo "No Music Playing"; fi
    font_family = JetBrainsMono Nerd Font
    font_size = 14
    color = $font_color
    position = 200, -40
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:5000] artist=$(playerctl metadata xesam:artist 2>/dev/null); if [ -n "$artist" ]; then echo "$artist" | cut -c1-30; else echo ""; fi
    font_family = JetBrainsMono Nerd Font
    font_size = 12
    color = $outer_color
    position = 200, -60
    halign = center
    valign = center
    zindex = 11
}

shape {
    monitor =
    size = 150, 75
    color = $check_color
    rounding = 20
    position = 115, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = 
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    color = $color
    position = 115, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:10000] iface=$(iw dev 2>/dev/null | grep Interface | head -1 | awk '{print $2}'); ssid=$(iw dev "$iface" link 2>/dev/null | grep SSID | awk '{print $2}'); if [ -n "$ssid" ]; then echo "$ssid" | cut -c1-14; else echo "Disconnected"; fi
    font_family = JetBrainsMono Nerd Font
    font_size = 10
    color = $color
    position = 115, -145
    halign = center
    valign = center
    zindex = 12
}

shape {
    monitor =
    size = 150, 75
    color = $check_color
    rounding = 20
    position = 285, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = 
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    color = $color
    position = 285, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:10000] device=$(bluetoothctl info 2>/dev/null | grep Name | cut -d' ' -f2-); if [ -n "$device" ]; then echo "$device" | cut -c1-14; else echo "Disconnected"; fi
    font_family = JetBrainsMono Nerd Font
    font_size = 10
    color = $color
    position = 285, -145
    halign = center
    valign = center
    zindex = 12
}

shape {
    monitor =
    size = 320, 100
    color = $outer_color
    rounding = 25
    position = 200, -235
    halign = center
    valign = center
    zindex = 11
}

shape {
    monitor =
    size = 100, 20
    color = $color
    rounding = 5
    position = 200, -205
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:10000] status=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); if [ "$status" = "Discharging" ]; then echo "!"; elif [ "$status" = "Charging" ]; then echo "󰚥"; else echo "!"; fi
    font_family = JetBrainsMono Nerd Font
    font_size = 12
    color = $outer_color
    position = 200, -205
    halign = center
    valign = center
    zindex = 13
}

label {
    monitor =
    text = cmd[update:10000] cap=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null); if [ -n "$cap" ]; then echo "$cap%"; else echo "--"; fi
    font_family = JetBrainsMono Nerd Font
    font_size = 24
    color = $color
    position = 200, -235
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:10000] status=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); if [ -n "$status" ]; then echo "$status"; else echo "N/A"; fi
    font_family = JetBrainsMono Nerd Font
    font_size = 10
    color = $color
    position = 200, -265
    halign = center
    valign = center
    zindex = 12
}
