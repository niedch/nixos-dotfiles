general {
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1e1e2e)
    blur_passes = 3
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = rgba(313244)
    outer_color = rgba(89b4fa)
    outline_thickness = 3

    font_family = JetBrainsMono Nerd Font
    font_color = rgba(cd9fce)

    placeholder_text = Enter Password
    check_color = rgba(a6e3a1)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}
