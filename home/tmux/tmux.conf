# set -g @plugin 'niedch/mux-session#tmux-plugin-support'

# Set the prefix to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# switch panes using Alt-arrow without prefix
bind -n M-^ last-window
bind h select-pane -L
bind l select-pane -R
bind j select-pane -U
bind k select-pane -D

bind r source-file ~/.config/tmux/tmux.conf
bind 'v' copy-mode

set -g mouse on
setw -g mode-keys vi
set-option -g allow-rename off

# Enable copy-paste with mouse
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

set -g base-index 1

# Set base index for panes to 1
setw -g pane-base-index 1
set -g escape-time 10
set -g status-interval 0
set -g default-shell "/run/current-system/sw/bin/zsh"

bind-key f run-shell "tmux neww ~/.config/tmux/tmux-sessionizer.sh"
bind-key i run-shell "~/.config/tmux/tmux-popup.sh"
bind-key o run-shell "tmux neww ~/.config/tmux/tmux-opener.sh"
bind-key -T prefix L switch-client -l

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:sync"
set -as terminal-overrides ',xterm*:sitm=\E[3m'
# Erlaubt das Durchreichen von Synchronisationssequenzen an Ghostty
set -g focus-events on

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

