# subtitles




# Added new hotkeys    ------------------------------------------------------------------------------------------------

# Next and previous video with UP DOWN arrow keys
#  you could  also use LEFT RIGHT if you like but they are the seek defaults like above
#  you could ditch this    "; script-message osc-playlist"    if you dont need to see the playlist on screen
UP      playlist-prev ; script-message osc-playlist                      # previous video  
DOWN    playlist-next ; script-message osc-playlist                      # next video

# control playback speed
CTRL+. add speed         0.25   									            # increase playback speed in 25 percent
CTRL+, add speed        -0.25                                                # decrease playback speed in 25 percent
ALT+,  set speed     1                                                  # reset  playback speed

# jump to exact percent like in youtube   Seek to X% of Video	1 to 9	1 goes to 10%, 5 to 50%, 9 to 90%, etc.
CTRL+1   no-osd   seek 10 absolute-percent+exact
CTRL+2   no-osd   seek 20 absolute-percent+exact
CTRL+3   no-osd   seek 30 absolute-percent+exact
CTRL+4   no-osd   seek 40 absolute-percent+exact
CTRL+5   no-osd   seek 50 absolute-percent+exact
CTRL+6   no-osd   seek 60 absolute-percent+exact
CTRL+7   no-osd   seek 70 absolute-percent+exact
CTRL+8   no-osd   seek 80 absolute-percent+exact
CTRL+9   no-osd   seek 90 absolute-percent+exact

# Paths and File Explorer
k       show-text ${path}                                                 # display full video path


Ctrl+e run "bash" "-c" 'nautilus "$(dirname "$(realpath "${path}")")"'    # open current video directory using nautilus


# Example to show text on the player
#h  show-text   "Hello omarchy"




# Example custom text help on screen pressing and holding h, simmilar to default i+4 but is custom text

h show-text "${osd-ass-cc/0}{\\b0}{\\fs5}\nOpen Video Path\n${osd-ass-cc/0}{\\b1}{\\fs8}    CTRL + E\n\n${osd-ass-cc/0}{\\b0}{\\fs5}Show Video Path (keep pressed)\n${osd-ass-cc/0}{\\b1}{\\fs8}    K\n\n${osd-ass-cc/0}{\\b0}{\\fs5}Take a screenshot\n${osd-ass-cc/0}{\\b1}{\\fs8}    S\n\n${osd-ass-cc/0}{\\b0}{\\fs5}Loop current video\n${osd-ass-cc/0}{\\b1}{\\fs8}    L\n\n${osd-ass-cc/0}{\\b0}{\\fs5}Next/Prev 1 frame\n${osd-ass-cc/0}{\\b1}{\\fs8}    .    ,\n\n${osd-ass-cc/0}{\\b0}{\\fs5}Next/Prev 7 frames\n${osd-ass-cc/0}{\\b1}{\\fs8}    UP ARROW    DOWN ARROW\n\n${osd-ass-cc/0}{\\b0}{\\fs5}Next/Prev video\n${osd-ass-cc/0}{\\b1}{\\fs8}    RIGHT ARROW    LEFT ARROW\n\n${osd-ass-cc/0}{\\b0}{\\fs5}Seek +5 / -5 seconds\n${osd-ass-cc/0}{\\b1}{\\fs8}    RIGHT ARROW    LEFT ARROW\n\n${osd-ass-cc/0}{\\b0}{\\fs5}Set playback speed (10% increments)\n${osd-ass-cc/0}{\\b1}{\\fs8}    CTRL + 1...9 \n"

