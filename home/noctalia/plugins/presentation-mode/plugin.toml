id = "local/presentation-mode"
name = "Presentation Mode"
version = "1.0.0"
plugin_api = 39
author = "nic"
license = "MIT"
icon = "presentation"
description = "Toggles Presentation Mode: increases system and terminal fonts, disables Ghostty transparency, and inhibits screen sleep."
tags = ["bar", "shortcut", "utility"]
dependencies = ["noctalia"]

[[setting]]
key = "text_scaling_factor"
type = "string"
label_key = "settings.text_scaling_factor.label"
description_key = "settings.text_scaling_factor.description"
default = "1.25"

[[setting]]
key = "ghostty_font_size"
type = "int"
label_key = "settings.ghostty_font_size.label"
description_key = "settings.ghostty_font_size.description"
default = 14
min = 9
max = 32

[[setting]]
key = "inhibit_idle"
type = "bool"
label_key = "settings.inhibit_idle.label"
description_key = "settings.inhibit_idle.description"
default = true

[[setting]]
key = "enable_dnd"
type = "bool"
label_key = "settings.enable_dnd.label"
description_key = "settings.enable_dnd.description"
default = true

[[widget]]
id = "presentation-mode"
entry = "widget.luau"

[[shortcut]]
id = "presentation-mode-toggle"
entry = "shortcut.luau"
